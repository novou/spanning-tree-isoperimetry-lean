version: "v0.4"

project:
  name: "Spanning-Tree Maximization Forces Isoperimetry in the Square Lattice"
  description: >-
    Lean formalization of spanning-tree maximization over finite connected induced
    subgraphs of the square lattice. The development establishes edge isoperimetry
    of every maximizer, the maximum count and all maximizing lattice-isometry
    classes at every positive cardinality, and uniqueness of the canonical
    corner-strip domain for N >= 18. Nonuniqueness occurs exactly at N = 3, 8, 10,
    13; the canonical count has exceptions at N = 7, 14, 17. It also establishes
    the sharp square-cardinality stability inequality, an exact scalar product
    formula and rational recurrence for corner-strip counts, the global extremal
    asymptotic expansion
    with O(N^(-1/2)) remainder, and the appendix's exact strip-energy Fourier
    identity, rectangular remainders, Green estimates, and explicit bounds.
  authors:
    - "Jiechen Zhang"
  license: "Apache-2.0"
  responsible_maintainers:
    - "Jiechen Zhang"

classification:
  arxiv: ["math.CO", "cs.DM"]
  msc2020: ["05C05", "05C35", "05C50", "05A16"]

