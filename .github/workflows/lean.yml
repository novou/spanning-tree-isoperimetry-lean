name: Lean verification

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: lean-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Build and audit proofs
    runs-on: ubuntu-latest
    timeout-minutes: 360
    env:
      LEAN_NUM_THREADS: '1'
    steps:
      - name: Check out source
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Install and check the Comparator sandbox
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y bubblewrap apparmor
          if [ "$(sysctl -n kernel.apparmor_restrict_unprivileged_userns 2>/dev/null || echo 0)" = 1 ]; then
            printf '%s\n' \
              'abi <abi/4.0>,' \
              'include <tunables/global>' \
              'profile bwrap /usr/bin/bwrap flags=(unconfined) {' \
              '  userns,' \
              '}' | sudo tee /etc/apparmor.d/bwrap >/dev/null
            sudo apparmor_parser -r /etc/apparmor.d/bwrap
          fi
          bwrap --unshare-all --die-with-parent --new-session \
            --ro-bind / / --proc /proc --dev /dev -- /bin/true

      - name: Restore Lean build cache
        id: lean-cache
        uses: actions/cache/restore@v5
        with:
          path: .lake
          key: lean-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('lean-toolchain', 'lake-manifest.json') }}-${{ github.run_id }}
          restore-keys: |
            lean-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('lean-toolchain', 'lake-manifest.json') }}-

      - name: Install pinned Lean and fetch mathlib cache
        uses: leanprover/lean-action@v1
        with:
          auto-config: 'false'
          build: 'false'
          test: 'false'
          lint: 'false'
          use-mathlib-cache: 'true'
          use-github-cache: 'false'

      - name: Connect the project toolchain wrapper
        shell: bash
        run: |
          mkdir -p .tooling
          ln -s "$HOME/.elan" .tooling/elan
          scripts/lake.sh env lean --version

      - name: Build proof and comparison modules sequentially
        run: python3 scripts/build_serial.py

      - name: Audit proof dependencies
        run: python3 scripts/audit.py

      - name: Save checked Lean build cache
        uses: actions/cache/save@v5
        with:
          path: .lake
          key: ${{ steps.lean-cache.outputs.cache-primary-key }}

      - name: Compare the independent Challenge and Solution statements
        id: comparator
        shell: bash
        run: scripts/lake.sh env lake comparator --config comparator.json 2>&1 | tee build/comparator.log

      - name: Summarize verification
        if: always()
        shell: bash
        env:
          COMPARATOR_OUTCOME: ${{ steps.comparator.outcome }}
        run: |
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          report = Path('build/audit.json')
          with Path(os.environ['GITHUB_STEP_SUMMARY']).open('a') as out:
              if report.exists():
                  data = json.loads(report.read_text())
                  out.write('### Lean verification\n\n')
                  out.write(f"Build and axiom audit passed for {data['theorem_declarations_audited']:,} theorem declarations.\n\n")
                  out.write(f"Checked {len(data['required_endpoints_checked'])} manuscript endpoints and {len(data['solution_theorems_checked'])} compared Solution theorem exports.\n\n")
                  out.write(f"Solution proof holes: {data['solution_proof_holes']}; independent Challenge statement holes: {data['challenge_statement_holes']}.\n\n")
                  out.write('Allowed axioms: `propext`, `Classical.choice`, `Quot.sound`.\n\n')
                  out.write(f"Statement comparison: {os.environ['COMPARATOR_OUTCOME']}.\n\n")
                  out.write('See `docs/coverage.md` for the manuscript statement index.\n')
              else:
                  out.write('Verification did not produce a successful audit report. See the failed step and attached logs.\n')
          PY

      - name: Retain verification logs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: lean-verification-logs
          path: |
            build/audit.json
            build/Audit.lean
            build/axioms.log
            build/comparator.log
            build/build.log
            build/serial/*.log
            build/serial/plan.json
          if-no-files-found: ignore
          retention-days: 14
