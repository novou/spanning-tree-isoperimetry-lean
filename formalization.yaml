fidelity:
  divergences: >-
    The principal statements use the manuscript's lattice domains, combinatorial
    spanning-tree counts, equality classes, and normalizations. The formal proof
    route uses exact finite Dirichlet solves for the boundary minors,
    Bernoulli-kernel quadrature for rectangular remainders, and checked rational
    series for numerical enclosures. Its determinant argument first obtains a
    finite-Green strip bound and then proves the exact Fourier identity locally.
    The Jacobi basis has alternating signs, preserving the scalar resolvent and
    leading minors. Fourier coefficients use minus gamma; face coordinates are
    zero-based. These correspondences and the detailed numerical derivations are
    explained in docs/proof-route-correspondence.md.

review:
  status: "agent-reviewed"
  reviewers:
    - "Codex agent: independent statement correspondence review"
  notes: >-
    A separate agent checked all sixteen statement interfaces and their
    definitions against the manuscript and implementation, including the
    exceptional counts, scalar formulas, and Fourier normalization.

alignment:
  namespace: "SpanningTreeChallenge"
  implementation_namespace: "SpanningTreeIsoperimetry"
  index: "docs/coverage.md"
  proof_correspondence: "docs/proof-route-correspondence.md"
  comparator_config: "comparator.json"
  challenge_module: "Challenge"
  solution_module: "Solution"
  verification_status: "v4.35.0-rc2 build, axiom audit, and Comparator passed"
  statements:
    - source: "thm:intro-isoperimetric and thm:isoperimetric-rigidity; edge isoperimetry"
      lean: "SpanningTreeChallenge.maximizer_isoperimetric"
      module: "Solution"
      implementation: "SpanningTreeIsoperimetry.maximizer_isoperimetric"
    - source: "thm:all-N-classification; maximum at every positive cardinality"
      lean: "SpanningTreeChallenge.maximum_value"
      module: "Solution"
      implementation: "SpanningTreeIsoperimetry.AllCardinalityClassification.maximumValueTarget"
    - source: "thm:all-N-classification; complete equality classes"
      lean: "SpanningTreeChallenge.maximizer_iff"
      module: "Solution"
      implementation: "SpanningTreeIsoperimetry.AllCardinalityClassification.maximizer_iff"
    - source: "thm:all-N-classification; exceptional nonuniqueness"
      lean: "SpanningTreeChallenge.nonuniqueness_iff"
      module: "Solution"
      implementation: "SpanningTreeIsoperimetry.AllCardinalityClassification.nonuniquenessTarget"
    - source: "thm:intro-classification and thm:all-N-classification; canonical uniqueness for N >= 18"
      lean: "SpanningTreeChallenge.unique_large"
      module: "Solution"
      implementation: "SpanningTreeIsoperimetry.LargeClassification.uniqueClassificationTarget"
    - source: "thm:sharp-stability; sharp stability inequality"
      lean: "SpanningTreeChallenge.sharp_stability"
      module: "Solution"
      implementation: "SpanningTreeIsoperimetry.sharp_stability_inequality"
    - source: "thm:sharp-stability; optimal coefficient"
      lean: "SpanningTreeChallenge.coefficient_optimal"
      module: "Solution"
      implementation: "SpanningTreeIsoperimetry.StabilitySharpness.coefficient_optimal"
    - source: "prop:scalar-resolvent; rational scalar resolvent"
      lean: "SpanningTreeChallenge.scalar_resolvent"
      module: "Solution"
      implementation: "SpanningTreeIsoperimetry.ScalarModular.boundaryGreen_rational_scalar_resolvent"
      note: >-
        The resolvent of 4I-A is expressed by the rational continuants and
        modular numerator. The identity is stated for every real z using Lean's
        total inverse and division conventions; away from the spectrum it is
        the ordinary scalar resolvent.
    - source: "Section 8.2; convergent scalar moment series"
      lean: "SpanningTreeChallenge.scalar_series"
      module: "Solution"
      implementation: "SpanningTreeIsoperimetry.ScalarSeries.rational_scalar_resolvent_hasSum"
      note: "HasSum of the boundary-Green moments divided by z^(n+1), for |z| > 6, equals q(z)/P(z)."
    - source: "prop:hankel-representation; leading Green and Hankel determinants"
      lean: "SpanningTreeChallenge.hankel_minor"
      module: "Solution"
      implementation: "SpanningTreeIsoperimetry.ScalarResolvent.hankel_determinant_of_commute"
    - source: "Section 8.3; the signed Euclidean chain"
      lean: "SpanningTreeChallenge.scalar_chain"
      module: "Solution"
      implementation: "SpanningTreeIsoperimetry.ScalarProduct.scalarRemainder_natDegree"
      note: >-
        Includes coprimality of the path polynomial and layer continuant, proper
        modular numerator, exact successive remainder degrees w-n, and linear
        quotients with positive leading coefficients through the chain.
    - source: "thm:scalar-product; exact corner-strip product"
      lean: "SpanningTreeChallenge.cornerStrip_product"
      module: "Solution"
      implementation: "SpanningTreeIsoperimetry.ScalarProduct.cornerStrip_product"
    - source: "thm:scalar-product; exact corner-strip recurrence"
      lean: "SpanningTreeChallenge.cornerStrip_recurrence"
      module: "Solution"
      implementation: "SpanningTreeIsoperimetry.CountingAlgorithm.countRecurrence_treeCount"
      note: >-
        Starting from the rectangle count, p_0=1, p_(n+1)=b_n*p_n and
        T_(n+1)=T_n/(b_n*p_n^2) yield the actual corner-strip count at every
        strip length 0 <= k <= w, using exact rational arithmetic.
    - source: "prop:extremal-asymptotic; extremal asymptotic expansion"
      lean: "SpanningTreeChallenge.extremal_count_asymptotic"
      module: "Solution"
      implementation: "SpanningTreeIsoperimetry.ExtremalAsymptotic.extremal_count_asymptotic"
    - source: "Appendix B.3; exact strip-energy Fourier identity"
      lean: "SpanningTreeChallenge.strip_fourier_identity"
      module: "Solution"
      implementation: "SpanningTreeIsoperimetry.StripFourierIdentity.strip_limit_identity"
    - source: "Appendix B.3; uniform strip-energy bound"
      lean: "SpanningTreeChallenge.strip_energy_bound"
      module: "Solution"
      implementation: "SpanningTreeIsoperimetry.UniformStripEnergy.stripEnergyLimit_lt"
      note: "The compared bound is C_strip < 13/200."

